<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- BEGIN generated security meta: python3 scripts/sync-security-meta.py --write -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://marincountygov.github.io/marin-os/catalog.json https://marincountygov.github.io/marin-os/data/lighthouse.json https://marincountygov.github.io/marin-os/data/tech.json https://api.github.com https://data.marincounty.gov; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <!-- END generated security meta -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marin Jobs | County of Marin</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23000'/%3E%3Cg fill='none' stroke='%23e5b53b' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round' transform='translate(9,9) scale(1.25)'%3E%3Crect width='7' height='7' x='3' y='3' rx='1'/%3E%3Crect width='7' height='7' x='14' y='3' rx='1'/%3E%3Crect width='7' height='7' x='14' y='14' rx='1'/%3E%3Crect width='7' height='7' x='3' y='14' rx='1'/%3E%3C/g%3E%3C/svg%3E">
    <meta name="description" content="Search and compare County of Marin job classifications and published pay rates.">
    <link rel="stylesheet" href="vendor/marinos/marinos.css">
    <link rel="stylesheet" href="assets/app.css">
    <script src="vendor/marinos/marinos.js" defer></script>
    <script src="assets/job-pay-core.js" defer></script>
    <script src="assets/app.js" defer></script>
  </head>
  <body>
    <noscript>
      <div class="container app-alert app-alert--warning">
        JavaScript is required to display the MarinOS interface and use this application.
      </div>
    </noscript>

    <marin-os-banner></marin-os-banner>

    <marin-app-header app-name="Marin Jobs" app-description="Search and compare County of Marin job classifications and published pay rates.">
      <template data-icon>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18M6 7v13h12V7M9 7V4h6v3M9 12h6M9 16h4"/></svg>
      </template>
    </marin-app-header>

    <main id="main" class="container app-main">
      <!-- Keep the primary workflow first; the shell uses it as the default view. -->
      <section id="start" data-tab-section="start" aria-label="Marin Jobs">
    
    
    
    <section id="explore" aria-labelledby="explore-title">
      <h2 class="visually-hidden" id="explore-title">Job class search</h2>
      <div id="job-error" class="app-alert app-alert--danger" role="alert" hidden>
        <p id="job-error-text">Could not load job classes and pay rates.</p><button type="button" id="job-retry" class="action-button">Retry</button>
      </div>
      <div class="search-layout">
        <div class="search-side" data-filter-column="filters.json" data-filter-name="job-classes"></div>
        <div class="search-results">
          <p id="job-results-count" class="search-results-count app-help-text" data-filter-results>Loading job classes and pay rates…</p>
          <p id="job-feed-status" class="app-help-text" hidden></p>
          <div id="job-summary" class="job-summary" hidden><span><strong id="job-total">0</strong> job classes</span><span><strong id="job-pay-schedules">0</strong> biweekly schedules</span><span><strong id="job-step-patterns">0</strong> step patterns</span><span><strong id="job-highest">—</strong> highest yearly maximum</span></div>
          <section id="job-compare" class="app-card job-compare" aria-labelledby="job-compare-title" hidden><div class="job-inline-heading"><h2 id="job-compare-title">Compare selected job classes</h2><button type="button" id="job-clear-compare" class="action-button">Clear comparison</button></div><p id="job-compare-summary" class="app-help-text" role="status" aria-live="polite"></p><div id="job-compare-table" class="app-table-wrap"></div></section>
          <div class="job-sort-controls"><label for="job-sort">Sort by</label><select id="job-sort"><option value="title">Title</option><option value="job_class_code">Class code</option><option value="min_yearly">Minimum yearly pay</option><option value="max_yearly">Maximum yearly pay</option><option value="min_hourly">Minimum hourly pay</option><option value="max_hourly">Maximum hourly pay</option><option value="hours_per_period">Hours per biweekly period</option><option value="number_of_steps">Number of steps</option></select><label for="job-sort-direction">Direction</label><select id="job-sort-direction"><option value="asc">A to Z / Low to high</option><option value="desc">Z to A / High to low</option></select></div>
          <ul id="job-results" class="search-results-list" aria-label="Job classifications"></ul>
          <div id="job-exports" class="job-exports" hidden><button type="button" id="job-export-csv" class="action-button">Export filtered CSV</button><button type="button" id="job-export-json" class="action-button">Export filtered JSON</button></div>
        </div>
      </div>
    </section>
    
  </section>

      <!-- Supply app-owned content only; the shell generates sections and headings. -->
      <marin-app-info app-name="Marin Jobs" repo="marin-jobs" security-src="security.json">
        <template data-about>
          <p>This tool reads the County's public <a href="https://data.marincounty.gov/d/w7uw-fvda" target="_blank" rel="noopener noreferrer">Job Classifications and Pay Rates dataset (opens in a new tab)</a>. Pay ranges belong to job classes, not individual people. They do not include overtime, deductions, premiums, or individual benefit costs.</p><p>Search, filtering, comparison, and exports happen in your browser. The public dataset is temporarily cached in your browser; your search and comparison choices are not saved. Pay rates and other data may change when the County updates the source dataset.</p>
        </template>
        <template data-accessibility>
          <p>Marin Jobs aims to meet WCAG 2.2 AA. Search, filters and results are standard form controls and lists, and result counts are announced as they change.</p>
          <p>A formal accessibility review has not been completed yet. If you find a problem, use the Feedback button or contact the County's innovation team.</p>
        </template>
      </marin-app-info>
    </main>

    <marin-app-footer app-name="Marin Jobs"></marin-app-footer>
    <marin-app-feedback></marin-app-feedback>
  </body>
</html>
